<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevLens</title>
    <link rel="icon" type="image/png" href="/favicon-devlens.png" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("devlens-theme");
          if (stored !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
